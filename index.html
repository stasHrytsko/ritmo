<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ritmo — personal day, week, month and year tracker." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ritmo" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Ritmo</title>

    <script>
      // Applied before the first paint so a stored theme does not flash the
      // other one while the app boots. Mirrors src/app/theme.ts.
      try {
        var saved = localStorage.getItem('ritmo:theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
          var color = saved === 'dark' ? '#14130f' : '#f3efe6';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = color;
          });
        }
      } catch (error) { /* storage blocked: fall back to the system theme */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
